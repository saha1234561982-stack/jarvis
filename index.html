<script>
window.addEventListener("error", e => {
  const s = document.getElementById("st");
  if(s) s.textContent = "⚠ " + e.message;
});
const $ = id => document.getElementById(id);
const API = "https://generativelanguage.googleapis.com/v1beta/";
const VARS = [{thinkingLevel:"minimal"}, {thinkingLevel:"low"}, {thinkingBudget:0}, null];
const VARS_MATH = [{thinkingLevel:"medium"}, {thinkingLevel:"low"}, {thinkingBudget:2048}, null];
const ld = (k, d) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } };
const sv = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

let key = localStorage.getItem("jkey") || "";
let hist = ld("jhist", []);
let facts = ld("jfacts", []);
let good = ld("jgood", null);
let uname = ld("juname", "Майки");
let people = ld("jpeople", {});
let pendingPhoto = null;
let live = null, outAn = null, onToolStep = null, toolsUsed = 0, editMode = false;
let lastApp = ld("japp", null);
let agentOn = ld("jagent", true);
let notes = ld("jnotes", {notes: [], todos: []});
let timers = ld("jtimers", []);
let hudState = "idle";
let models = null, busy = false, speaking = false, listening = false, hf = true;
let pendingSteps = [];
let imgModel = null, imgTried = false, lastSrc = [], useStream = true;

function setStatus(t){
  $("st").textContent = t;
  hudState = t.startsWith("🎤") ? "listen" : t.startsWith("📞") ? "live" : t.startsWith("🔊") ? "speak"
    : /^(💭|🧮|🔎|🎨|📷|✍|⌨|🔧)/u.test(t) ? "think" : "idle";
}
function subtitle(t){ const s = $("sub"); if(s) s.textContent = t; }
function idle(){ setStatus(hf ? "🎧 Жду, говори…" : "Готов"); }

function add(cls, text){
  const d = document.createElement("div");
  d.className = "m " + cls; d.textContent = text;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
  if(cls === "j" && text) subtitle(text);
  return d;
}
function b64blob(b64, mime){
  const bin = atob(b64), n = bin.length, u = new Uint8Array(n);
  for(let i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], {type: mime});
}
function addImg(mime, b64){
  const d = add("j", "");
  const url = URL.createObjectURL(b64blob(b64, mime));
  const im = document.createElement("img");
  im.src = url;
  d.appendChild(im);
  const a = document.createElement("a");
  a.href = url; a.download = "jarvis.png"; a.textContent = "💾 Сохранить";
  d.appendChild(a);
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}
function askKey(){
  const k = prompt("Вставь ключ Gemini API:");
  if(k){ key = k.trim(); localStorage.setItem("jkey", key); models = null; ttsTried = false; ttsModel = null; imgTried = false; imgModel = null; }
}
$("kb").onclick = askKey;

const CODE_SYS = "Ты — разработчик мини-приложений. Верни ТОЛЬКО один полный HTML-документ (<!DOCTYPE html> … </html>) со встроенными CSS и JavaScript. Без внешних файлов, библиотек и ссылок, без пояснений и без markdown. Приложение должно работать на телефоне: <meta name=viewport>, крупные кнопки, управление касанием. Оформление тёмное и аккуратное, текст на русском.";
function sys(mode){
  if(mode === "code") return CODE_SYS;
  const d = new Date().toLocaleString("ru-RU", {weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"});
  let s = "Ты Джарвис, умный и учтивый голосовой ассистент. Пользователя зовут " + uname + " (используй именно это имя). ";
  if(mode === "math"){
    s += "Сейчас режим задач: реши аккуратно по шагам и проверь вычисления (если нужно, выполни код). Формулы пиши обычным текстом без LaTeX, используй × ÷ √ ^. В самом конце добавь отдельную строку «ИТОГ: …» с коротким ответом одним предложением. ";
  }else if(mode === "search"){
    s += "Используй поиск в интернете для свежих данных. Отвечай живо и коротко, 1-3 предложения, без списков и markdown. ";
  }else if(mode === "live"){
    s += "Ты ведёшь живой голосовой разговор: отвечай очень коротко и естественно, как человек, по-русски. Если пользователь просит что-то сделать (таймер, заметка, поиск, картинка) — вызови нужный инструмент. ";
  }else{
    s += "Говори живо и естественно, как человек в разговоре: короткие фразы, 1-3 предложения, без списков, смайликов и markdown. ";
    if(mode === "agent") s += "У тебя есть инструменты (таймеры, заметки, память, поиск, рисование, мини-приложения): если пользователь просит что-то сделать, вызови инструмент, а не просто отвечай словами; потом коротко подтверди результат. Не выдумывай результаты инструментов. ";
  }
  s += "Отвечай по-русски. Сейчас: " + d + ".";
  if(facts.length) s += " Что ты знаешь о пользователе: " + facts.join("; ") + ".";
  const pk = Object.keys(people);
  if(pk.length) s += " Люди из окружения пользователя: " + pk.map(k => k + " — " + people[k]).join("; ") + ".";
  return s;
}

// ---------- голос ----------
let voices = [];
let vi = ld("jvoice", 0);
let actx = null, curSrc = null, ttsModel = null, ttsTried = false;
let sp = null, ttsChain = Promise.resolve();

function loadVoices(){
  const b = (window.speechSynthesis ? speechSynthesis.getVoices() : [])
    .filter(v => /^ru/i.test(v.lang)).map(v => ({name: v.name, v}));
  voices = [
    {name: "Gemini · Puck (живой, бодрый)", g: "Puck"},
    {name: "Gemini · Charon (спокойный)", g: "Charon"},
    {name: "Gemini · Fenrir (энергичный)", g: "Fenrir"},
    {name: "Gemini · Kore (женский)", g: "Kore"},
    ...b
  ];
}
loadVoices();
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;

document.addEventListener("click", () => {
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
  }catch(e){}
}, {once: true});

async function findTts(){
  if(ttsModel || ttsTried || !key) return ttsModel;
  ttsTried = true;
  try{
    const d = await call(API + "models?pageSize=100&key=" + key, {}, 8000);
    const l = (d.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes("generateContent") && /tts/.test(m.name))
      .map(m => m.name);
    ttsModel = l.find(n => /flash/.test(n)) || l[0] || null;
  }catch(e){}
  return ttsModel;
}

async function gFetch(text, voiceName){
  const m = await findTts();
  if(!m) throw new Error("нет TTS-модели");
  const d = await call(API + m + ":generateContent?key=" + key, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      contents: [{parts: [{text: "Say naturally, warmly and at a brisk pace: " + text.slice(0, 500)}]}],
      generationConfig: {
        responseModalities: ["AUDIO"],
        speechConfig: {voiceConfig: {prebuiltVoiceConfig: {voiceName}}}
      }
    })
  }, 15000);
  const parts = (d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || [];
  const p = parts.find(x => x.inlineData);
  if(!p) throw new Error("нет аудио");
  const bin = atob(p.inlineData.data);
  const n = bin.length >> 1;
  const f = new Float32Array(n);
  for(let i = 0; i < n; i++){
    let s = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
    if(s >= 32768) s -= 65536;
    f[i] = s / 32768;
  }
  const rm = /rate=(\d+)/.exec(p.inlineData.mimeType || "");
  const rate = rm ? parseInt(rm[1]) : 24000;
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  const b = actx.createBuffer(1, n, rate);
  b.copyToChannel(f, 0);
  return b;
}
function gQueue(S, text, v){
  const p = ttsChain.then(() => S.dead ? null : gFetch(text, v)).catch(() => null);
  ttsChain = p;
  return p;
}

async function playBuf(buf){
  if(actx.state === "suspended") await actx.resume();
  return new Promise(res => {
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = 1.1;
    src.connect(getOutAn());
    src.onended = res;
    curSrc = src;
    setStatus("🔊 Говорю…");
    src.start();
  });
}

function bPlay(text, voice){
  return new Promise(res => {
    if(!window.speechSynthesis){ res(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ru-RU";
    if(voice) u.voice = voice;
    u.pitch = 1.0; u.rate = 1.15;
    u.onend = res; u.onerror = res;
    setStatus("🔊 Говорю…");
    speechSynthesis.speak(u);
    setTimeout(res, text.length * 100 + 4000);
  });
}

async function playItem(it, S){
  const e = voices.length ? voices[vi % voices.length] : null;
  if(it.p){
    let buf = null;
    try{ buf = await it.p; }catch(x){}
    if(S.dead) return;
    if(buf){ await playBuf(buf); return; }
    await bPlay(it.text, null);
    return;
  }
  await bPlay(it.text, e ? e.v : null);
}

function spStop(){
  const S = sp; sp = null;
  try{ if(curSrc) curSrc.stop(); }catch(e){}
  curSrc = null;
  if(window.speechSynthesis) speechSynthesis.cancel();
  speaking = false;
  if(S){ S.dead = true; if(S.cb) S.cb(); }
}
function stopAudio(){ spStop(); }

function spStart(){
  spStop();
  if(!$("v").checked) return;
  sp = {pos: 0, q: [], run: false, fin: false, dead: false, cb: null};
  speaking = true;
}

function spPush(S, text, e){
  const t = text.replace(/[*#_`]/g, "").trim();
  if(!t) return;
  const it = {text: t};
  if(e && e.g) it.p = gQueue(S, t, e.g);
  S.q.push(it);
}

function spFeed(full, final){
  const S = sp;
  if(!S || S.dead) return;
  const e = voices.length ? voices[vi % voices.length] : null;
  let rest = full.slice(S.pos);
  const re = /^[\s\S]{12,}?[.!?…]+["»)]*\s+/;
  let m;
  while((m = re.exec(rest))){
    spPush(S, rest.slice(0, m[0].length), e);
    S.pos += m[0].length;
    rest = rest.slice(m[0].length);
  }
  if(final){
    if(rest.trim()) spPush(S, rest, e);
    S.pos = full.length;
    S.fin = true;
  }
  spRun();
}

function spEnd(cb){
  const S = sp;
  if(!S){ speaking = false; if(cb) cb(); return; }
  S.cb = cb; S.fin = true;
  spRun();
}

async function spRun(){
  const S = sp;
  if(!S || S.run) return;
  S.run = true;
  while(!S.dead){
    const it = S.q.shift();
    if(!it){
      if(S.fin) break;
      await new Promise(r => setTimeout(r, 80));
      continue;
    }
    await playItem(it, S);
  }
  S.run = false;
  if(!S.dead){
    sp = null; speaking = false;
    if(S.cb) S.cb();
  }
}

function speak(text, cb){ const em = emoteOf(text); if(em) avEmote(em, 3.5); spStart(); spFeed(text, true); spEnd(cb); }
function finish(){
  busy = false; idle();
  if(pendingSteps.length){ const n = pendingSteps.shift(); setTimeout(() => send(n, null, true), 500); return; }
  if(hf) setTimeout(listen, 300);
}
const say = t => speak(t, finish);

// ---------- микрофон ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen(){ if(!rec || listening || speaking || busy) return; try{ rec.start(); }catch(e){} }
if(SR){
  rec = new SR();
  rec.lang = "ru-RU";
  rec.onstart = () => { listening = true; $("mic").classList.add("on"); setStatus("🎤 Слушаю…"); };
  rec.onend = () => {
    listening = false; $("mic").classList.remove("on");
    if(!busy && !speaking){ idle(); if(hf) setTimeout(listen, 500); }
  };
  rec.onresult = e => send(e.results[0][0].transcript);
  rec.onerror = e => {
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){
      hf = false; $("hf").classList.remove("on");
      add("j", "Нет доступа к микрофону. Разреши его для Chrome в настройках.");
    }else if(!hf && e.error !== "aborted" && e.error !== "no-speech"){
      add("j", "Микрофон: " + e.error);
    }
  };
  $("mic").onclick = () => {
    if(listening){ rec.stop(); return; }
    stopAudio(); listen();
  };

// ---------- быстрые команды, память, калькулятор ----------
function calc(t){
  if(t.length > 60) return null;
  if(!(/(сколько будет|посчитай|вычисли|реши|=|\?)/i.test(t) || /[+*\/×÷^]|плюс|минус|умножить|разделить|поделить/i.test(t))) return null;
  let s = t.toLowerCase()
    .replace(/сколько будет|посчитай|вычисли|реши|равно|=|\?/g, " ")
    .replace(/плюс/g, "+").replace(/минус/g, "-")
    .replace(/умножить на|помножить на/g, "*").replace(/разделить на|поделить на/g, "/")
    .replace(/[×хx]/g, "*").replace(/÷/g, "/").replace(/\^/g, "**")
    .replace(/,/g, ".").replace(/\s+/g, "");
  if(!/^[0-9+\-*\/().]+$/.test(s) || !/[+\-*\/]/.test(s) || !/[0-9]/.test(s)) return null;
  try{
    const v = Function('"use strict";return (' + s + ')')();
    if(typeof v !== "number" || !isFinite(v)) return null;
    return String(Math.round(v * 1e10) / 1e10);
  }catch(e){ return null; }
}


// ---------- люди и имена ----------
const REL = {"друга":"друг","подругу":"подруга","брата":"брат","сестру":"сестра","маму":"мама","папу":"папа","бабушку":"бабушка","дедушку":"дедушка","жену":"жена","мужа":"муж","сына":"сын","дочь":"дочь","одноклассника":"одноклассник","одноклассницу":"одноклассница","коллегу":"коллега","учителя":"учитель","учительницу":"учительница","собаку":"собака","кота":"кот","кошку":"кошка","девушку":"девушка","парня":"парень","соседа":"сосед","соседку":"соседка","тренера":"тренер"};
const RELW = "мой|моя|моё|мое|мои|друг|подруга|брат|сестра|мама|папа|бабушка|дедушка|жена|муж|сын|дочь|одноклассник|одноклассница|коллега|учитель|учительница|собака|кот|кошка|девушка|парень|сосед|соседка|тренер|начальник|директор";
const NM = "[A-Za-zА-Яа-яЁё-]{2,25}";
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function findPerson(w){
  w = w.toLowerCase();
  for(const k of Object.keys(people)){
    const kl = k.toLowerCase();
    if(kl === w) return k;
    if(kl.length > 3 && w.length > 3 && kl.slice(0, -1) === w.slice(0, -1)) return k;
  }
  return null;
}
function savePeople(){ sv("jpeople", people); }
function personCmd(t){
  const x = t.trim().replace(/[.!?]+$/, "");
  const pre = "(?:запомни[,:]?\\s*(?:что\\s+)?)?";
  let m = x.match(new RegExp("^" + pre + "меня зовут\\s+(" + NM + ")$", "i"));
  if(m){ uname = cap(m[1]); sv("juname", uname); return "Хорошо, буду называть тебя " + uname + "."; }
  const relKeys = Object.keys(REL).join("|");
  m = x.match(new RegExp("^" + pre + "(?:мо(?:его|ю|й|я|и|их)\\s+)?(" + relKeys + ")\\s+зовут\\s+(" + NM + ")$", "i"));
  if(m){
    const n = cap(m[2]); people[n] = REL[m[1].toLowerCase()]; savePeople();
    return "Запомнил: " + n + " — " + people[n] + ".";
  }
  m = x.match(new RegExp("^" + pre + "(" + NM + ")\\s*(?:—|–|-|это)\\s*((?:" + RELW + ")(?:\\s.*)?)$", "i"));
  if(m && !/^(я|ты|он|она|оно|мы|они|это|что|кто|мой|моя|мои|моё|мое|меня|мне|тот|эта|этот)$/i.test(m[1])){
    const n = cap(m[1]); people[n] = m[2].trim(); savePeople();
    return "Запомнил: " + n + " — " + people[n] + ".";
  }
  m = x.match(new RegExp("^забудь\\s+(?!всё|все$)(" + NM + ")$", "i"));
  if(m){
    const k = findPerson(m[1]);
    if(!k) return "Такого человека я не помню.";
    delete people[k]; savePeople();
    return "Забыл: " + k + ".";
  }
  m = x.match(new RegExp("^(?:кто\\s+(?:такой|такая|это)|что ты (?:знаешь|помнишь) (?:про|о|об)|расскажи (?:про|о|об))\\s+(" + NM + ")$", "i"));
  if(m){
    const k = findPerson(m[1]);
    if(k) return k + " — " + people[k] + ".";
    return null;
  }
  if(/(кого ты знаешь|каких людей ты знаешь|список людей|кого ты помнишь)/i.test(x)){
    const ks = Object.keys(people);
    return ks.length ? "Я знаю: " + ks.map(k => k + " — " + people[k]).join("; ") + "." : "Пока никого. Скажи, например: «запомни, что Саня — мой друг».";
  }
  return null;
}

function local(t){
  const s = t.toLowerCase().replace(/[!?.,]/g, " ").replace(/\s+/g, " ").trim();
  const now = new Date();
  const pc = personCmd(t);
  if(pc !== null) return pc;
  const m = t.trim().match(/^(запомни|запиши)[:,]?\s+(.+)/i);
  if(m){
    const f0 = m[2].trim().replace(/^что\s+/i, ""); facts.push(f0); facts = facts.slice(-30); sv("jfacts", facts);
    return "Запомнил: " + f0;
  }
  if(/что (ты )?(помнишь|знаешь) (обо мне|про меня)/.test(s))
    {
    const pk = Object.keys(people).map(k => k + " — " + people[k]);
    const all = [...facts, ...pk];
    return "Тебя зовут " + uname + "." + (all.length ? " Я помню: " + all.join("; ") + "." : " Больше пока ничего. Скажи «запомни» и что нужно запомнить.");
  }
  if(/^забудь (всё|все)/.test(s)){
    facts = []; hist = []; people = {}; sv("jfacts", facts); sv("jhist", hist); savePeople();
    $("chat").innerHTML = ""; return "Всё забыл.";
  }
  if(/^(привет|здравствуй|хай)/.test(s) && s.length < 20) return "Приветствую, " + uname + ". Чем могу помочь?";
  if(/(который час|сколько времени)/.test(s))
    return "Сейчас " + now.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
  if(/(какое число|какая дата|какой сегодня день)/.test(s))
    return "Сегодня " + now.toLocaleDateString("ru-RU", {weekday:"long", day:"numeric", month:"long"});
  if(/(выключи|отключи) (агента|инструменты)/.test(s)){ agentOn = false; sv("jagent", false); return "Инструменты отключены."; }
  if(/(включи|подключи) (агента|инструменты)/.test(s)){ agentOn = true; sv("jagent", true); return "Инструменты включены."; }
  const c = calc(t);
  if(c !== null) return "Будет " + c;
  return null;
}

const IMG_RE = /(нарису[йе]|нарисовать|сгенерируй (мне )?(картинк|изображени|фото|рисунок)|создай (мне )?(картинк|изображени|рисунок)|сделай (мне )?(картинк|рисунок)|покажи (мне )?картинку)/i;
const SEARCH_RE = /(новост|погод|курс (доллар|евро|валют|биткоин|рубл)|что нового|последни[еяй]|в интернете|поищи|загугли|результат[ыа]? матч|сколько стоит|какая цена)/i;
const MATH_RE = /(реши|решить|посчитай|подсчитай|вычисли|сколько будет|задач|уравнени|интеграл|производн|корень из|процент|дроб|площад|периметр|теорем|докажи|\d\s*[+*\/×÷^]\s*\d)/i;
const CODE_RE = /(сделай|создай|напиши|построй|разработай)\s+(мне\s+)?(игру|мини-?игру|сайт|веб-?сайт|приложение|калькулятор|страницу|лендинг|программу|секундомер|плеер)/i;
function detectMode(t){
  if(IMG_RE.test(t)) return "image";
  if(CODE_RE.test(t)) return "code";

}
function finalSpeech(ans){

  if(m) return "Ответ: " + m[1].replace(/\s+/g, " ").slice(0, 300);
  const lines = ans.split("\n").map(x => x.trim()).filter(Boolean);
  return (lines[lines.length - 1] || ans).slice(0, 300);
}

// ---------- сеть ----------
async function call(url, opt, ms){
  const c = new AbortController();
  const timer = setTimeout(() => c.abort(), ms);
  try{
    const r = await fetch(url, {...opt, signal: c.signal});
    const d = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error((d.error && d.error.message) || ("HTTP " + r.status));
    return d;
  }catch(e){
    if(e.name === "AbortError") throw new Error("нет ответа за " + (ms / 1000) + "с");
    throw e;
  }finally{ clearTimeout(timer); }
}

async function getModels(){
  if(models) return models;
  const d = await call(API + "models?pageSize=100&key=" + key, {}, 8000);
  const all = (d.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map(m => m.name)
    .filter(n => /flash/.test(n) && !/image|tts|live|audio|embed|thinking|exp|preview|latest|2\.5/.test(n));
  const lite = all.filter(n => /lite/.test(n));
  const rest = all.filter(n => !/lite/.test(n));
  models = [...lite, ...rest].slice(0, 5);
  if(!models.length) throw new Error("нет доступных flash-моделей");
  return models;
}

function timeoutFor(o){ return o.mode === "math" ? 40000 : o.mode === "code" ? 60000 : o.agent ? 25000 : 15000; }

function baseContents(o){
  if(o.contents) return o.contents.map(x => x);
  const c = hist.slice(-10).map(x => x);
  while(c.length && c[0].role !== "user") c.shift();
  if(c.length){
    const last = c[c.length - 1];
    const parts = [];
    if(o.img) parts.push({inlineData: {mimeType: o.img.mime, data: o.img.data}});
    parts.push({text: o.prompt});
    c[c.length - 1] = {role: last.role, parts};
  }
  return c;
}

function makeBody(variant, o, contents){
  const body = {
    systemInstruction: {parts: [{text: sys(o.mode)}]},
    contents: contents || baseContents(o),
    generationConfig: {maxOutputTokens: o.maxTokens || (o.mode === "math" ? 1800 : 400)}
  };
  if(variant) body.generationConfig.thinkingConfig = variant;
  if(o.agent) body.tools = [{functionDeclarations: TOOLS_DECL}];
  else if(o.tools) body.tools = o.mode === "math" ? [{code_execution: {}}] : [{google_search: {}}];
  return body;
}

function partsOf(d){
  return (d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || [];
}
function textOf(d){ return partsOf(d).filter(p => p.text && !p.thought).map(p => p.text).join(""); }
function srcOf(d){
  const g = d.candidates && d.candidates[0] && d.candidates[0].groundingMetadata;
  (g && g.groundingChunks || []).forEach(c => {
    if(c.web && !lastSrc.some(x => x.uri === c.web.uri)) lastSrc.push({title: c.web.title || c.web.uri, uri: c.web.uri});
  });
}

async function ask(m, variant, o){
  const d = await call(API + m + ":generateContent?key=" + key, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(makeBody(variant, o))
  }, timeoutFor(o));
  lastSrc = []; srcOf(d);
  return textOf(d);
}

async function streamCore(m, body, ms, onChunk){
  const ctrl = new AbortController();
  let timer = setTimeout(() => ctrl.abort(), ms);
  try{
    const r = await fetch(API + m + ":streamGenerateContent?alt=sse&key=" + key, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
    if(!r.ok){
      const d = await r.json().catch(() => ({}));
      throw new Error((d.error && d.error.message) || ("HTTP " + r.status));
    }
    const rd = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while(true){
      const {done, value} = await rd.read();
      if(done) break;
      clearTimeout(timer);
      timer = setTimeout(() => ctrl.abort(), ms);
      buf += dec.decode(value, {stream: true});
      const lines = buf.split("\n");
      buf = lines.pop();
      for(const ln of lines){
        if(!ln.startsWith("data:")) continue;
        let d = null;
        try{ d = JSON.parse(ln.slice(5)); }catch(e){}
        if(d) onChunk(d);
      }
    }
  }catch(e){
    if(e.name === "AbortError") throw new Error("нет ответа за " + (ms / 1000) + "с");
    throw e;
  }finally{ clearTimeout(timer); }
}

async function askStream(m, variant, o, onText){
  lastSrc = [];
  let full = "";
  await streamCore(m, makeBody(variant, o), timeoutFor(o), d => {
    srcOf(d);
    const t = textOf(d);
    if(t){ full += t; onText(full); }
  });
  return full;
}

// агент: модель сама вызывает инструменты, мы выполняем и возвращаем результат
async function agentRun(m, variant, o){
  const contents = baseContents(o);
  let finalText = "";
  for(let step = 0; step < 6; step++){
    let text = "", calls = [], raw = [];
    await streamCore(m, makeBody(variant, o, contents), timeoutFor(o), d => {
      srcOf(d);
      for(const p of partsOf(d)){
        if(p.thought) continue;
        raw.push(p);
        if(p.text){ text += p.text; o.ui.text(text); }
        if(p.functionCall) calls.push(p.functionCall);
      }
    });
    if(!calls.length){ finalText = text; break; }
    contents.push({role: "model", parts: raw});
    const resp = [];
    for(const c of calls){
      let out;
      try{ out = await runTool(c.name, c.args || {}); }catch(e){ out = "Ошибка: " + e.message; }
      toolsUsed++;
      resp.push({functionResponse: {name: c.name, response: {output: String(out).slice(0, 4000)}}});
    }
    contents.push({role: "user", parts: resp});
  }
  if(!finalText && toolsUsed) finalText = "Готово.";
  return finalText;
}

async function runAsk(m, vars, o, onText, log, name){
  for(let i = o.start || 0; i < vars.length; i++){
    try{
      if(!o.quiet) spStart();
      let ans;
      if(o.agent) ans = await agentRun(m, vars[i], o);
      else if(useStream && !o.noStream) ans = await askStream(m, vars[i], o, onText);
      else ans = await ask(m, vars[i], o);
      if(!ans) throw new Error("пустой ответ");
      return {ans, vi: i};
    }catch(e){
      log.push(name + (o.tools ? "+tools" : "") + (o.agent ? "+agent" : "") + " [" + i + "]: " + e.message.slice(0, 70));
      if(/API key not valid|API_KEY_INVALID/i.test(e.message)) throw e;
      if(useStream && /Failed to fetch|getReader|reader|stream/i.test(e.message)){ useStream = false; i--; continue; }
      if(/invalid argument|thinking|budget|level/i.test(e.message)) continue;
      throw e;
    }
  }
  throw new Error("варианты размышления не подошли");
}

// отдельный запрос «в сторону» (для инструментов), не трогает чат и голос
async function sideAsk(prompt, mode){
  const list = await getModels();
  const vars = mode === "math" ? VARS_MATH : VARS;
  let lastErr = null;
  for(const m of list){
    for(const tools of [true, false]){
      try{
        const r = await runAsk(m, vars, {mode, tools, prompt, quiet: true, noStream: true,
          contents: [{role: "user", parts: [{text: prompt}]}]}, null, [], m);
        return r.ans;
      }catch(e){
        lastErr = e;
        if(/API key not valid|API_KEY_INVALID/i.test(e.message)) throw e;
      }
    }
  }
  throw lastErr || new Error("не получилось");
}

function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      const du = c.toDataURL("image/jpeg", 0.82);
      URL.revokeObjectURL(url);
      res({mime: "image/jpeg", data: du.split(",")[1], url: du});
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("не удалось открыть фото")); };
    im.src = url;
  });
}

function fmtDur(s){
  s = Math.round(s);
  if(s < 60) return s + " сек";
  if(s < 3600) return Math.round(s / 60) + " мин";
  return (s / 3600).toFixed(1).replace(/\.0$/, "") + " ч";
}
function beep(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880; g.gain.value = 0.15;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.35);
  }catch(e){}
}
function armTimer(t){
  setTimeout(() => {
    timers = timers.filter(x => !(x.at === t.at && x.msg === t.msg)); sv("jtimers", timers);
    add("j", "⏰ " + t.msg);
    beep();
    setTimeout(() => speak(t.msg, null), 450);
  }, Math.max(0, t.at - Date.now()));
}

function notesText(){
  const n = notes.notes.map((x, i) => (i + 1) + ". " + x).join("\n");
  const t = notes.todos.map((x, i) => (i + 1) + ". " + x).join("\n");
  return "Заметки:\n" + (n || "нет") + "\nСписок дел:\n" + (t || "пуст");
}
function safeCalc(expr){
  const s = String(expr).replace(/\^/g, "**").replace(/,/g, ".").replace(/\s+/g, "");
  if(!/^[0-9+\-*\/().]+$/.test(s)) return null;
  try{
    const v = Function('"use strict";return (' + s + ')')();
    return (typeof v === "number" && isFinite(v)) ? String(Math.round(v * 1e10) / 1e10) : null;
  }catch(e){ return null; }
}

async function runTool(name, a){
  if(onToolStep) onToolStep(name, a);
  switch(name){
    case "set_timer": {
      const s = Math.max(1, Math.min(86400, Number(a.seconds) || 0));
      const t = {at: Date.now() + s * 1000, msg: String(a.message || "Время вышло")};
      timers.push(t); sv("jtimers", timers); armTimer(t);
      return "Таймер поставлен на " + fmtDur(s) + ". Он сработает, пока приложение открыто.";
    }
    case "add_note": {
      const txt = String(a.text || "").trim();
      if(!txt) return "Пустой текст.";
      (a.kind === "todo" ? notes.todos : notes.notes).push(txt); saveNotes();
      return a.kind === "todo" ? "Добавлено в список дел." : "Заметка сохранена.";
    }
    case "list_notes": return notesText();
    case "done_todo": {
      const i = Math.round(Number(a.number)) - 1;
      if(!(i >= 0 && i < notes.todos.length)) return "Нет дела с таким номером.";
      const x = notes.todos.splice(i, 1)[0]; saveNotes();
      return "Вычеркнуто: " + x;
    }
    case "remember_fact": {
      const f = String(a.text || "").trim();
      if(f){ facts.push(f); facts = facts.slice(-30); sv("jfacts", facts); }
      return "Запомнил.";
    }
    case "remember_person": {
      const n = cap(String(a.name || "").trim());
      if(n){ people[n] = String(a.relation || "знакомый"); savePeople(); }
      return "Запомнил: " + n + " — " + people[n] + ".";
    }
    case "calculate": {
      const r = safeCalc(a.expression);
      return r === null ? "Не удалось посчитать это выражение." : "Результат: " + r;
    }
    case "get_time":
      return new Date().toLocaleString("ru-RU", {weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit"});
    case "web_search":
      return await sideAsk(String(a.query || ""), "search");
    case "draw_image": {
      try{
        const im = await genImage(String(a.prompt || ""));
        addImg(im.mimeType, im.data);

    }
    case "open_link": {

      if(!/^https?:\/\//i.test(u)) u = "https://" + u;
      const d = add("j", "");

      d.appendChild(l);

      catch(e){ return "Не получилось создать приложение: " + e.message; }
    }
  }
  return "Неизвестный инструмент.";
}

function extractHtml(t){
  t = String(t).replace(/^\s*```(?:html)?\s*/i, "").replace(/```\s*$/, "");
  const i = t.search(/<!DOCTYPE|<html/i);
  if(i > 0) t = t.slice(i);
  const j = t.toLowerCase().lastIndexOf("</html>");
  if(j > 0) t = t.slice(0, j + 7);
  return t.trim();
}
function appTitle(html){
  const m = /<title>([^<]{1,60})<\/title>/i.exec(html);
  return m ? m[1].trim() : "Приложение";
}

async function genApp(desc, base, onProgress){
  let contents;
  if(base){
    contents = [
      {role: "user", parts: [{text: "Вот текущий код приложения:\n" + base}]},
      {role: "model", parts: [{text: "Принял."}]},
      {role: "user", parts: [{text: "Измени приложение: " + desc + ". Верни полный обновлённый HTML-документ."}]}
    ];
  }else{
    contents = [{role: "user", parts: [{text: "Сделай: " + desc}]}];
  }
  const list = await getModels();
  let lastErr = null;
  for(const m of list){
    try{
      const o = {mode: "code", contents, quiet: true, maxTokens: 8000, start: 0};
      const r = await runAsk(m, VARS, o, t => { if(onProgress) onProgress(t.split("\n").length); }, [], m.replace("models/", ""));
      const html = extractHtml(r.ans);
      if(html.indexOf("<") < 0) throw new Error("модель не вернула код");
      return html;
    }catch(e){
      lastErr = e;
      if(/API key not valid|API_KEY_INVALID/i.test(e.message)) throw e;
    }
  }
  throw lastErr || new Error("не получилось написать код");

let japps = ld("japps", []);
let jcmds = ld("jcmds", []);
const normCmd = s => s.toLowerCase().replace(/[.,!?;:«»"'—–-]/g, " ").replace(/\s+/g, " ").trim();
function libSave(){ japps = japps.slice(-20); sv("japps", japps); }
function libAdd(html){

function cmdSave(){ sv("jcmds", jcmds); }
function matchCmd(text){
  const t = normCmd(text);
  if(t.length < 4) return null;
  for(const c of jcmds){
    const p = normCmd(c.phrase);
    if(p && (t === p || (p.length >= 6 && t.includes(p)))) return c;
  }
  return null;
}
function findApp(q){
  const n = parseInt(q, 10);
  if(!isNaN(n) && String(n) === q.trim()) return n - 1;
  const qq = normCmd(q);
  return japps.findIndex(x => normCmd(x.t).includes(qq));
}
function libCmd(text){
  const x = text.trim().replace(/[.!?]+$/, "");
  if(/^(очисти|очистить|удали|сотри)\s+(чат|экран|надписи|сообщения|всё|все)$/i.test(x)){
    $("chat").innerHTML = ""; hist = []; sv("jhist", hist);
    return "Чат очищен.";
  }
  if(/^(какие модели|мои модели|список моделей)$/i.test(x)){
    idbNames().then(ns => add("j", ns.length ? "Модели: " + ns.map((n, i) => (i + 1) + ". " + n).join("; ") + "." : "Моделей пока нет. Нажми 📂 и выбери все .vrm сразу."));
    return "Смотрю библиотеку…";
  }
  const sw = x.split(" ").length <= 5
    ? x.match(/^(?:переодень(?:ся|сь)|переоденься|смени(?:ть)?|надень|модель)(?:\s+в)?(?:\s+модел[ьи])?\s*(.*)$/i)
    : null;
  if(sw){
    if(!avNames.length){ idbNames().catch(() => {}); return "Моделей пока нет. Нажми 📂 и выбери все .vrm сразу."; }
    let nm = null;
    if(sw[1].trim()){
      nm = avFindName(sw[1]);
      if(!nm) return "Не нашла такую модель. Скажи «какие модели».";
    }else{
      const cur = avNames.indexOf(ld("jvrmname", ""));
      nm = avNames[(cur + 1) % avNames.length];
    }
    if(!avOn) avSet(true);
    avSwitchTo(nm).then(ok => add("j", ok ? "Переодеваюсь: " + nm + "." : "Не получилось загрузить модель."));
    return "Переодеваюсь: " + nm + "…";
  }
  const g0 = x.split(" ").length <= 4 ? gestureOf(x) : null;
  if(g0){ avDo(g0); return ACT_LABEL[g0]; }
  if(/помаш|машешь|махни/i.test(x)){ avDo("wave"); return "Машу!"; }
  if(/кивни|кивай/i.test(x)){ avDo("nod"); return "Киваю."; }
  const em = emoCmd(x);
  if(em !== undefined){ avEmote(em === "neutral" ? null : em, 4); return em === "neutral" ? "Спокоен." : "Сейчас покажу."; }
  let m = x.match(/^(?:когда я (?:говорю|скажу)|если я (?:говорю|скажу))\s+[«"]?(.+?)[»"]?\s*[,:—–-]\s*(.+)$/i);
  if(m){
    const phrase = m[1].trim();
    const steps = m[2].split(/\s*;\s*|\s+(?:потом|затем)\s+/i).map(s => s.trim()).filter(Boolean);
    jcmds = jcmds.filter(c => normCmd(c.phrase) !== normCmd(phrase));
    jcmds.push({phrase, steps}); jcmds = jcmds.slice(-30); cmdSave();
    return "Запомнил команду «" + phrase + "»: " + steps.join(" → ");
  }
  if(/^(мои команды|какие команды|список команд)$/i.test(x))
    return jcmds.length
      ? "Твои команды: " + jcmds.map(c => "«" + c.phrase + "» → " + c.steps.join(", ")).join("; ") + "."
      : "Команд пока нет. Скажи, например: «когда я говорю спокойной ночи, поставь таймер на 30 минут; расскажи сказку».";
  m = x.match(/^забудь команду\s+(.+)$/i);
  if(m){
    const before = jcmds.length, n = normCmd(m[1]);
    jcmds = jcmds.filter(c => normCmd(c.phrase) !== n); cmdSave();
    return before !== jcmds.length ? "Забыл команду «" + m[1] + "»." : "Не нашёл такой команды.";
  }
  if(/^(мои приложения|список приложений|библиотека приложений|библиотека)$/i.test(x)){
    openLib();
    return japps.length ? "Открыл библиотеку: приложений " + japps.length + "." : "Библиотека пока пуста.";
  }
  m = x.match(/^(?:открой|запусти) приложение\s+(.+)$/i);
  if(m){
    const i = findApp(m[1]);
    if(i < 0 || !japps[i]) return "Не нашёл такое приложение.";
    openFull(japps[i].h); return "Открываю «" + japps[i].t + "».";
  }
  m = x.match(/^(?:удали|сотри) приложение\s+(.+)$/i);
  if(m){
    const i = findApp(m[1]);
    if(i < 0 || !japps[i]) return "Не нашёл такое приложение.";
    const t = japps[i].t; libDel(i); return "Удалил «" + t + "».";
  }
  return null;
}

async function avLoadBlob(f, name){

    await avLibs();
    if(!av) avInit();

    const loader = new THREE.GLTFLoader();
    if(THREE.VRMLoaderPlugin) loader.register(parser => new THREE.VRMLoaderPlugin(parser));
    const gltf = await new Promise((res, rej) => loader.load(url, res, undefined, rej));

      vrm = await imp.import(gltf);
    }
    if(!vrm) throw new Error("это не VRM-модель (файл .vrm)");
    vrm.scene.rotation.y = Math.PI;
    if(av.vrm) av.scene.remove(av.vrm.scene);
    av.vrm = vrm; av.scene.add(vrm.scene);

    const box = new THREE.Box3().setFromObject(vrm.scene);
    const size = box.getSize(new THREE.Vector3());
    const ctr = box.getCenter(new THREE.Vector3());

    av.cam.position.set(ctr.x, focusY, ctr.z + dist + size.z);
    av.cam.lookAt(ctr.x, focusY, ctr.z);
    av.cam.updateProjectionMatrix();
    av.box = {size: size.clone(), ctr: ctr.clone(), top};
    avFrame();
    avPose(vrm);
    avSetupLife(vrm);
    avMsg("", false);
    avCap.textContent = avCreditFor(name);
    avCap.style.display = "block";

    avMsg("Не получилось: " + e.message, true);
    return false;
  }
}

    });

function avFreeSpot(){
  const bad = [];
  const W = window.innerWidth, H = window.innerHeight;
  for(let i = 0; i < 80; i++){
    const x = Math.random() * (W - 210) + 5;
    const y = 60 + Math.random() * Math.max(20, H - 400);
    const r = {left: x, top: y, right: x + 200, bottom: y + 320};
    const hit = bad.some(b => !(r.right < b.left || r.left > b.right || r.bottom < b.top || r.top > b.bottom));

  }

}
function avWalkFloat(dt){
  if(av.sitting){ av.walkMoving = false; if(av.fx !== undefined) avDiv.style.left = av.fx + "px"; return; }
  if(avDrag){
    av.fx = parseFloat(avDiv.style.left) || 0;
    av.fy = parseFloat(avDiv.style.top) || 0;
    av.walkMoving = false;
    return;
  }
  if(av.fx === undefined){
    av.fx = window.innerWidth - 220; av.fy = window.innerHeight - 340;
    av.fg = null; av.fwait = 1; av.fdir = 1;
  }
  av.walkMoving = false;
  if(av.fwait > 0){ av.fwait -= dt; }
  else if(!av.fg){ av.fg = avFreeSpot(); if(!av.fg) av.fwait = 2; }
  if(av.fg && av.fwait <= 0){
    const dx = av.fg.x - av.fx, dy = av.fg.y - av.fy, d = Math.hypot(dx, dy);
    if(d < 3){ av.fg = null; av.fwait = 1.5 + Math.random() * 2.5; }
    else{
      const s = Math.min(d, 85 * dt);
      av.fx += dx / d * s; av.fy += dy / d * s;
      av.walkMoving = true;
      if(Math.abs(dx) > 1) av.fdir = dx < 0 ? -1 : 1;
    }
  }
  const bob = av.walkMoving ? Math.abs(Math.sin(av.t * 9)) * 4 : 0;
  avDiv.style.left = av.fx + "px";
  avDiv.style.top = (av.fy - bob) + "px";
  avDiv.style.transform = "scaleX(" + (av.fdir || 1) + ")";
}

function avRainInit(){

function avRainSize(){
  const r = avRain;

  if(w === r.w && h === r.h) return;
  r.w = w; r.h = h; r.cv.width = w; r.cv.height = h;
  const n = Math.floor(w / r.fs);
  r.cols = Array.from({length: n}, () => Array.from({length: 3}, () => ({y: Math.random() * h, v: 40 + Math.random() * 90})));
  r.ctx.fillStyle = "#000";

function avRainLoop(){
  if(!avRain) return;
  if(!avDiv.classList.contains("on")){ avBgRaf = null; return; }
  avRainSize();
  const r = avRain, c = r.ctx;
  const now = performance.now();
  const dt = Math.min((now - r.last) / 1000, 0.05);
  r.last = now;
  c.fillStyle = "rgba(0,0,0,0.13)";
  c.fillRect(0, 0, r.w, r.h);
  c.font = r.fs + "px monospace";
  c.textAlign = "center";
  r.cols.forEach((drops, i) => {
    const x = i * r.fs + r.fs / 2;
    drops.forEach(d => {
      d.y -= d.v * dt;
      if(d.y < -r.fs){ d.y = r.h + Math.random() * r.h * 0.3; d.v = 40 + Math.random() * 90; }
      c.fillStyle = "#c8ffd8";
      c.fillText(String(Math.floor(Math.random() * 10)), x, d.y);
      c.fillStyle = "rgba(0,255,65,0.75)";
      c.fillText(String(Math.floor(Math.random() * 10)), x, d.y + r.fs);
    });
  });

}

function getOutAn(){
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if(!outAn){
    outAn = actx.createAnalyser(); outAn.fftSize = 512;
    outAn.connect(actx.destination);

function rmsOf(an){
  if(!an) return 0;
  const a = new Uint8Array(an.fftSize);
  an.getByteTimeDomainData(a);
  let s = 0;
  for(let i = 0; i < a.length; i++){ const d = (a[i] - 128) / 128; s += d * d; }
  return Math.sqrt(s / a.length);
}
(function(){
  const cv = $("hud"), g = cv.getContext("2d");
  let lv = 0;
  const COL = {idle: "#00ff41", listen: "#00ffd0", think: "#ffd000", speak: "#00ff41", live: "#ff4fd8"};
  const LBL = {idle: "ГОТОВ", listen: "СЛУШАЮ", think: "ДУМАЮ", speak: "ГОВОРЮ", live: "ЖИВОЙ ЭФИР"};
  function frame(now){
    requestAnimationFrame(frame);
    if(document.hidden) return;
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if(!w || !h) return;
    if(cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const t = now / 1000, st = hudState, col = COL[st] || COL.idle;
    const micAn = live && live.micAn;
    let target;
    if(st === "speak") target = Math.max(rmsOf(outAn) * 3, 0.15 + 0.12 * Math.abs(Math.sin(t * 7) * Math.sin(t * 2.3)));
    else if(st === "listen") target = Math.max(rmsOf(micAn) * 4, 0.10 + 0.06 * Math.sin(t * 5));
    else if(st === "live") target = Math.max(rmsOf(outAn) * 3, rmsOf(micAn) * 4, 0.08 + 0.04 * Math.sin(t * 3));
    else if(st === "think") target = 0.10 + 0.05 * Math.sin(t * 9);
    else target = 0.05 + 0.025 * Math.sin(t * 1.6);
    lv += (Math.min(target, 0.6) - lv) * 0.2;
    const cx = w / 2, cy = h / 2 - (document.body.classList.contains("hud") ? h * 0.08 : 6);
    const R = Math.min(w, h * 1.05) * 0.24;
    // свечение
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, R * (1.7 + lv * 2));
    gr.addColorStop(0, col + "66"); gr.addColorStop(1, col + "00");
    g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R * (1.7 + lv * 2), 0, 7); g.fill();
    // ядро
    const cr = g.createRadialGradient(cx, cy, 0, cx, cy, R * (0.6 + lv * 0.7));
    cr.addColorStop(0, "#ffffffcc"); cr.addColorStop(0.35, col + "ee"); cr.addColorStop(1, col + "11");
    g.fillStyle = cr; g.beginPath(); g.arc(cx, cy, R * (0.6 + lv * 0.7), 0, 7); g.fill();
    // кольца
    g.strokeStyle = col; g.lineCap = "round";
    for(let k = 0; k < 3; k++){
      const rr = R * (1.0 + k * 0.3), sp = (0.5 + k * 0.45) * (k % 2 ? -1 : 1) * (st === "think" ? 3 : 1);
      g.lineWidth = 3 - k * 0.6; g.globalAlpha = 0.9 - k * 0.2;
      for(let a = 0; a < 4; a++){
        const s0 = t * sp + a * Math.PI / 2 + k;
        g.beginPath(); g.arc(cx, cy, rr, s0, s0 + 0.9 + k * 0.15); g.stroke();
      }
    }
    // волна вокруг
    g.globalAlpha = 0.85; g.lineWidth = 2;
    const N = 72;
    for(let i = 0; i < N; i++){
      const a = i / N * Math.PI * 2 + t * 0.2;
      const len = 3 + 34 * lv * (0.35 + 0.65 * Math.abs(Math.sin(i * 0.9 + t * 5 + Math.sin(t + i))));
      const r1 = R * 1.12, r2 = r1 + len;
      g.beginPath(); g.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      g.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); g.stroke();
    }
    // внешние засечки
    g.globalAlpha = 0.35; g.lineWidth = 1;
    for(let i = 0; i < 60; i++){
      const a = i / 60 * Math.PI * 2 - t * 0.1;
      const r1 = R * 2.05, r2 = r1 + (i % 5 ? 4 : 9);
      g.beginPath(); g.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      g.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); g.stroke();
    }
    // подписи
    g.globalAlpha = 0.9; g.fillStyle = col; g.font = "11px monospace";
    g.textAlign = "left"; g.fillText(new Date().toLocaleTimeString("ru-RU"), 8, 14);
    g.textAlign = "right"; g.fillText("JARVIS v44", w - 8, 14);
    g.textAlign = "center"; g.fillText(LBL[st] || "", cx, Math.min(h - 6, cy + R * 2.3 + 14));
    g.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
})();

function b64(buf){
  const u = new Uint8Array(buf);
  let s = "";
  for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}

function connectLive(cands, i){
  const L = live;
  if(!L) return;
  const model = cands[i];
  const ws = new WebSocket("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + encodeURIComponent(key));
  L.ws = ws; L.ready = false;
  ws.onopen = () => {
    const setup = {
      model,
      generationConfig: {responseModalities: ["AUDIO"], speechConfig: {voiceConfig: {prebuiltVoiceConfig: {voiceName: liveVoice()}}}},
      systemInstruction: {parts: [{text: sys("live")}]},
      inputAudioTranscription: {},
      outputAudioTranscription: {}
    };
    if(!L.noTools) setup.tools = [{functionDeclarations: TOOLS_DECL}];
    ws.send(JSON.stringify({setup}));
  };
  ws.onmessage = async e => {
    let txt = e.data;
    if(typeof txt !== "string"){ try{ txt = await e.data.text(); }catch(x){ return; } }
    let m = null;
    try{ m = JSON.parse(txt); }catch(x){ return; }
    onLiveMsg(m);
  };
  ws.onclose = ev => {
    if(L.closed || live !== L) return;
    const why = ev.reason ? String(ev.reason).slice(0, 160) : ("код " + ev.code);
    if(!L.ready){
      if(!L.noTools && /tool|function/i.test(why)){ L.noTools = true; connectLive(cands, i); return; }
      if(i + 1 < cands.length){ connectLive(cands, i + 1); return; }
      add("j", "Не удалось начать живой разговор: " + why);
    }else{
      add("j", "📞 Разговор завершён (" + why + ")");
    }
    liveStop(true);
  };
  ws.onerror = () => {};
}

function onLiveMsg(m){
  const L = live;
  if(!L) return;
  if(m.setupComplete){
    L.ready = true;
    startCapture();
    $("camb").hidden = false;
    setStatus("📞 Говори, я слушаю…");
    add("j", "📞 Живой разговор включён. Говори, можно перебивать. Лучше в наушниках.");
    return;
  }
  const sc = m.serverContent;
  if(sc){
    if(sc.interrupted){ stopLivePlayback(); L.j = null; }
    const parts = (sc.modelTurn && sc.modelTurn.parts) || [];
    for(const p of parts){
      if(p.inlineData && /audio/.test(p.inlineData.mimeType || "")) playLive(p.inlineData.data, p.inlineData.mimeType);
    }
    if(sc.inputTranscription && sc.inputTranscription.text) liveText("u", sc.inputTranscription.text);
    if(sc.outputTranscription && sc.outputTranscription.text) liveText("j", sc.outputTranscription.text);
    if(sc.turnComplete){ L.u = null; L.j = null; }
  }
  if(m.toolCall) handleLiveTools(m.toolCall);
}

async function handleLiveTools(tc){
  const L = live;
  const out = [];
  const prev = onToolStep;
  onToolStep = (n) => { add("j", "🔧 " + n); };
  for(const c of (tc.functionCalls || [])){
    let r;
    try{ r = await runTool(c.name, c.args || {}); }catch(e){ r = "Ошибка: " + e.message; }
    out.push({id: c.id, name: c.name, response: {output: String(r).slice(0, 4000)}});
  }
  onToolStep = prev;
  if(L && live === L && L.ws && L.ws.readyState === 1) L.ws.send(JSON.stringify({toolResponse: {functionResponses: out}}));
}

function startCapture(){
  const L = live;
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  L.ctx = ctx;
  const src = ctx.createMediaStreamSource(L.stream);
  L.micAn = ctx.createAnalyser(); L.micAn.fftSize = 512;
  src.connect(L.micAn);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  L.proc = proc;
  proc.onaudioprocess = e => {
    if(!live || live !== L || !L.ws || L.ws.readyState !== 1 || !L.ready) return;
    const inp = e.inputBuffer.getChannelData(0);
    let s2 = 0;
    for(let i = 0; i < inp.length; i++) s2 += inp[i] * inp[i];
    // пока Джарвис говорит, тихий звук (эхо динамика) не отправляем, громкую речь — отправляем (чтобы можно было перебить)
    if(L.playing && Math.sqrt(s2 / inp.length) < 0.05) return;
    const ratio = ctx.sampleRate / 16000;
    const n = Math.floor(inp.length / ratio);
    const pcm = new Int16Array(n);
    for(let i = 0; i < n; i++){
      const s = Math.max(-1, Math.min(1, inp[Math.floor(i * ratio)]));
      pcm[i] = s < 0 ? s * 32768 : s * 32767;
    }
    L.ws.send(JSON.stringify({realtimeInput: {audio: {data: b64(pcm.buffer), mimeType: "audio/pcm;rate=16000"}}}));
  };
  src.connect(proc);
  proc.connect(ctx.destination);
}

function playLive(data, mime){
  const L = live;
  if(!L) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  actx = actx || new AC();
  if(actx.state === "suspended") actx.resume();
  const bin = atob(data), n = bin.length >> 1, f = new Float32Array(n);
  for(let i = 0; i < n; i++){
    let s = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
    if(s >= 32768) s -= 65536;
    f[i] = s / 32768;
  }
  const rm = /rate=(\d+)/.exec(mime || "");
  const buf = actx.createBuffer(1, n, rm ? parseInt(rm[1]) : 24000);
  buf.copyToChannel(f, 0);
  const src = actx.createBufferSource();
  src.buffer = buf;
  src.connect(getOutAn());
  const t = Math.max(actx.currentTime + 0.02, L.nextT || 0);
  src.start(t);
  L.nextT = t + buf.duration;
  L.srcs.push(src); L.playing = true;
  src.onended = () => {
    L.srcs = L.srcs.filter(x => x !== src);
    if(!L.srcs.length) L.playing = false;
  };
}
function stopLivePlayback(){
  const L = live;
  if(!L) return;
  L.srcs.forEach(s => { try{ s.onended = null; s.stop(); }catch(e){} });
  L.srcs = []; L.nextT = 0; L.playing = false;
}

async function camToggle(){
  const L = live;
  if(!L || !L.ready) return;
  if(L.camStream){ camStop(); return; }
  try{
    L.camStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment", width: {ideal: 640}}});
  }catch(e){ add("j", "Нет доступа к камере: " + e.message); return; }
  const v = $("lv");
  v.srcObject = L.camStream; v.classList.add("on");
  try{ await v.play(); }catch(e){}
  $("camb").classList.add("on");
  const c = document.createElement("canvas");
  L.camTimer = setInterval(() => {
    if(!live || live !== L || !L.ws || L.ws.readyState !== 1 || !v.videoWidth) return;
    const k = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
    c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    const du = c.toDataURL("image/jpeg", 0.6);
    L.ws.send(JSON.stringify({realtimeInput: {video: {data: du.split(",")[1], mimeType: "image/jpeg"}}}));
  }, 1000);
}
function camStop(){
  const L = live;
  if(!L) return;
  if(L.camTimer){ clearInterval(L.camTimer); L.camTimer = null; }
  if(L.camStream){ L.camStream.getTracks().forEach(t => t.stop()); L.camStream = null; }
  $("lv").classList.remove("on"); $("lv").srcObject = null;
  $("camb").classList.remove("on");
}

function liveStop(silent){
  const L = live;
  if(!L) return;
  L.closed = true;
  camStop();
  try{ if(L.ws) L.ws.close(); }catch(e){}
  try{ if(L.proc){ L.proc.onaudioprocess = null; L.proc.disconnect(); } }catch(e){}
  try{ if(L.ctx) L.ctx.close(); }catch(e){}
  try{ L.stream.getTracks().forEach(t => t.stop()); }catch(e){}
  stopLivePlayback();
  live = null;
  busy = false;
  $("camb").hidden = true;
  $("live").classList.remove("on");
  if(!silent) add("j", "📞 Разговор завершён.");
  idle();
}
$("live").onclick = () => { if(live) liveStop(); else liveStart(); };
$("camb").onclick = camToggle;

// ---------- главная функция ----------
const DOTS = '<span class="dots"><i></i><i></i><i></i></span>';
function argsShort(a){
  try{ const s = JSON.stringify(a); return s.length > 60 ? s.slice(0, 57) + "…" : s; }catch(e){ return ""; }
}

async function send(text, photo, chain){
  text = (text || "").trim();
  if(live){
    const g = gestureOf(text);
    if(g){ avDo(g); $("t").value = ""; add("u", text); add("j", ACT_LABEL[g]); return; }
    if(text) liveSendText(text); $("t").value = ""; return;
  }
  if(busy) return;
  if(!photo && pendingPhoto) photo = pendingPhoto;
  if(!text && !photo) return;
  if(photo && photo === pendingPhoto) clearPending();
  if(!photo && !editMode && !chain){
    const lib = libCmd(text);
    if(lib !== null){ $("t").value = ""; add("u", text); add("j", lib); say(lib); return; }
    const lc = matchCmd(text);
    if(lc){
      $("t").value = "";
      add("u", text);
      add("j", "▶ " + lc.steps.join(" → "));
      pendingSteps = lc.steps.slice(1);
      return send(lc.steps[0], null, true);
    }
  }
  busy = true;
  const ub = add("u", text || "📷 Фото");
  if(photo){
    const im = document.createElement("img");
    im.src = photo.url;
    ub.appendChild(im);
  }
  $("t").value = "";

  if(!photo && editMode && lastApp){
    if(/^(отмена|хватит|стоп|выйти)\.?$/i.test(text)){ setEdit(false); add("j", "Режим правки выключен."); finish(); return; }
    await doCode(text, true);
    return;
  }

  if(!photo){
    const quick = local(text);
    if(quick){ add("j", quick); say(quick); return; }
  }

  if(!key) askKey();
  if(!key){ add("j", "Нужен ключ: нажми 🔑"); finish(); return; }

  let mode = detectMode(text);
  if(photo) mode = (!text || mode === "math") ? "math" : "chat";
  else if(mode === "image"){ await doImage(text); return; }
  else if(mode === "code"){ await doCode(text, false); return; }

  const prompt = (photo && !text)
    ? "Посмотри на фото. Если там задача или пример — реши по шагам. Иначе коротко опиши, что на фото."
    : text;
  hist.push({role: "user", parts: [{text: photo ? "[фото] " + (text || "что на фото?") : text}]});

  const box = add("j", "");
  box.innerHTML = DOTS;
  setStatus(mode === "math" ? "🧮 Решаю…" : mode === "search" ? "🔎 Ищу…" : photo ? "📷 Смотрю…" : "💭 Думаю…");
  const log = [];
  const vars = mode === "math" ? VARS_MATH : VARS;
  const agentWanted = mode === "chat" && agentOn;
  const configs = (mode === "math" || mode === "search") ? [{tools: true}, {tools: false}]
    : agentWanted ? [{agent: true}, {}] : [{}];
  try{
    let list = await getModels();
    if(good && list.includes(good.m)) list = [good.m, ...list.filter(x => x !== good.m)];
    for(const m of list){
      const name = m.replace("models/", "");
      for(const cfg of configs){
        const t0 = Date.now();
        let tl = null, tx = null, first = true;
        toolsUsed = 0;
        try{
          if(cfg.agent){
            box.innerHTML = "";
            tl = document.createElement("small"); tl.style.whiteSpace = "pre-wrap";
            tx = document.createElement("div"); tx.innerHTML = DOTS;
            box.append(tl, tx);
          }
          const setTxt = t => { if(tx) tx.textContent = t; else box.textContent = t; };
          const onText = t => {
            if(first){ first = false; setStatus("✍️ Отвечаю…"); }
            setTxt(t); subtitle(t);
            if(mode !== "math") spFeed(t, false);
            $("chat").scrollTop = $("chat").scrollHeight;
          };
          const o = {
            mode: cfg.agent ? "agent" : mode, tools: cfg.tools, agent: cfg.agent, img: photo, prompt,
            start: (mode === "chat" && !cfg.agent && good && good.m === m) ? good.v : 0,
            ui: {text: onText}
          };
          if(cfg.agent) onToolStep = (n, a) => { if(tl) tl.textContent += "🔧 " + n + " " + argsShort(a) + "\n"; setStatus("🔧 " + n + "…"); };
          let r;
          try{ r = await runAsk(m, vars, o, onText, log, name); }
          finally{ onToolStep = null; }
          const ans = r.ans;
          if(mode === "chat" && !cfg.agent){ good = {m, v: r.vi}; sv("jgood", good); }
          hist.push({role: "model", parts: [{text: ans.slice(0, 1500)}]});
          hist = hist.slice(-30); sv("jhist", hist);
          if(tx){ tx.textContent = ans; if(!tl.textContent) tl.remove(); } else box.textContent = ans;
          subtitle(ans);
          const s = document.createElement("small");
          s.textContent = name + (cfg.tools ? (mode === "math" ? " +код" : " +поиск") : "")
            + (cfg.agent && toolsUsed ? " +инструменты ×" + toolsUsed : "") + " · " + ((Date.now() - t0) / 1000).toFixed(1) + "с";
          box.appendChild(s);
          if(mode === "search" && lastSrc.length){
            const sr = document.createElement("small");
            sr.textContent = "Источники: " + lastSrc.slice(0, 3).map(x => x.title).join(", ");
            box.appendChild(sr);
          }
          $("chat").scrollTop = $("chat").scrollHeight;
          spFeed(mode === "math" ? finalSpeech(ans) : ans, true);
          spEnd(finish);
          return;
        }catch(e){
          if(/API key not valid|API_KEY_INVALID/i.test(e.message)) throw e;
          if(cfg.agent && toolsUsed) throw e;
        }
      }
    }
    throw new Error("ни одна модель не ответила");
  }catch(e){
    spStop();
    hist.pop();
    box.textContent = "Ошибка: " + e.message + "\n\n" + log.join("\n");
    finish();
  }
}
