<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Джарвис</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#00ff41;font-family:monospace;display:flex;flex-direction:column;height:100dvh}
header{padding:10px 16px;background:#000;border-bottom:1px solid #0a4d1a;display:flex;justify-content:space-between;align-items:center}
header b{color:#00ff41;font-size:20px;text-shadow:0 0 8px #00ff41}
header span{display:flex;align-items:center;gap:6px;font-size:13px}
input[type=checkbox]{accent-color:#00ff41}
#st{padding:4px 16px;background:#000;font-size:12px;color:#00b32c;border-bottom:1px solid #0a4d1a}
#chat{flex:1;overflow-y:auto;padding:12px;background:#000}
.m{max-width:85%;padding:10px 14px;margin:8px 0;border-radius:12px;border:1px solid #0a4d1a;white-space:pre-wrap;line-height:1.4;animation:p .2s}
@keyframes p{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.u{background:#031f09;border-color:#00ff41;margin-left:auto}
.j{background:#000}
small{display:block;color:#00b32c;opacity:.7;margin-top:6px;font-size:11px}
.dots i{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:#00ff41;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
#bar{display:flex;gap:8px;padding:10px;background:#000;border-top:1px solid #0a4d1a}
#t{flex:1;min-width:0;padding:12px;border-radius:20px;border:1px solid #0a4d1a;background:#000;color:#00ff41;font-size:16px;font-family:monospace}
#t::placeholder{color:#0a7a22}
button{border:0;border-radius:50%;width:46px;height:46px;font-size:20px;background:#00ff41;color:#000}
button.on{background:#ff3b3b}
.k{background:none;color:#00ff41;width:auto;height:auto;font-size:18px;border-radius:8px;padding:2px 4px}
.k.on{background:#ff3b3b}
</style></head><body>
<header><b>🤖 Джарвис</b>
<span><label><input type="checkbox" id="v" checked> голос</label>
<button class="k" id="vc" title="Сменить голос">🎙</button>
<button class="k" id="hf" title="Режим разговора">🎧</button>
<button class="k" id="clr" title="Очистить чат">🗑</button>
<button class="k" id="kb">🔑</button></span></header>
<div id="st">Готов</div>
<div id="chat"></div>
<div id="bar">
<input id="t" placeholder="Скажи или напиши...">
<button id="mic">🎤</button>
<button id="go">➤</button>
</div>
<script>
window.addEventListener("error", e => {
  const s = document.getElementById("st");
  if(s) s.textContent = "⚠ " + e.message;
});
const $ = id => document.getElementById(id);
const API = "https://generativelanguage.googleapis.com/v1beta/";
const VARS = [{thinkingLevel:"minimal"}, {thinkingLevel:"low"}, {thinkingBudget:0}, null];
const ld = (k, d) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } };
const sv = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

let key = localStorage.getItem("jkey") || "";
let hist = ld("jhist", []);
let facts = ld("jfacts", []);
let good = ld("jgood", null);
let models = null, busy = false, speaking = false, listening = false, hf = false;function setStatus(t){ $("st").textContent = t; }
function idle(){ setStatus(hf ? "🎧 Жду, говори…" : "Готов"); }

function add(cls, text){
  const d = document.createElement("div");
  d.className = "m " + cls; d.textContent = text;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}
function askKey(){
  const k = prompt("Вставь ключ Gemini API:");
  if(k){ key = k.trim(); localStorage.setItem("jkey", key); models = null; ttsTried = false; ttsModel = null; }
}
$("kb").onclick = askKey;

function sys(){
  const d = new Date().toLocaleString("ru-RU", {weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"});
  return "Ты Джарвис, умный и учтивый голосовой ассистент. Пользователя зовут Майки (именно Майки, не Майка). Говори живо и естественно, как человек в разговоре: короткие фразы, 1-3 предложения, без списков, смайликов и markdown. Отвечай по-русски. Сейчас: " + d + "."
    + (facts.length ? " Что ты знаешь о Майки: " + facts.join("; ") + "." : "");
}

// ---------- голос ----------
let voices = [];
let vi = ld("jvoice", 0);
let actx = null, curSrc = null, ttsModel = null, ttsTried = false;
let sp = null, ttsChain = Promise.resolve();

function loadVoices(){
  const b = (window.speechSynthesis ? speechSynthesis.getVoices() : [])
    .filter(v => /^ru/i.test(v.lang)).map(v => ({name: v.name, v}));
  voices = [
    {name: "Gemini · Puck (живой, бодрый)", g: "Puck"},
    {name: "Gemini · Charon (спокойный)", g: "Charon"},
    {name: "Gemini · Fenrir (энергичный)", g: "Fenrir"},
    {name: "Gemini · Kore (женский)", g: "Kore"},
    ...b
  ];
}
loadVoices();
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;

document.addEventListener("click", () => {
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
  }catch(e){}
}, {once: true});

async function findTts(){
  if(ttsModel || ttsTried || !key) return ttsModel;
  ttsTried = true;
  try{
    const d = await call(API + "models?pageSize=100&key=" + key, {}, 8000);
    const l = (d.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes("generateContent") && /tts/.test(m.name))
      .map(m => m.name);
    ttsModel = l.find(n => /flash/.test(n)) || l[0] || null;
  }catch(e){}
  return ttsModel;
}

async function gFetch(text, voiceName){
  const m = await findTts();
  if(!m) throw new Error("нет TTS-модели");
  const d = await call(API + m + ":generateContent?key=" + key, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      contents: [{parts: [{text: "Say naturally, warmly and at a brisk pace: " + text.slice(0, 500)}]}],
      generationConfig: {
        responseModalities: ["AUDIO"],
        speechConfig: {voiceConfig: {prebuiltVoiceConfig: {voiceName}}}
      }
    })
  }, 15000);
  const parts = (d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || [];
  const p = parts.find(x => x.inlineData);
  if(!p) throw new Error("нет аудио");
  const bin = atob(p.inlineData.data);
  const n = bin.length >> 1;
  const f = new Float32Array(n);
  for(let i = 0; i < n; i++){
    let s = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
    if(s >= 32768) s -= 65536;
    f[i] = s / 32768;
  }
  const rm = /rate=(\d+)/.exec(p.inlineData.mimeType || "");
  const rate = rm ? parseInt(rm[1]) : 24000;
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  const b = actx.createBuffer(1, n, rate);
  b.copyToChannel(f, 0);
  return b;
}
function gQueue(S, text, v){
  const p = ttsChain.then(() => S.dead ? null : gFetch(text, v)).catch(() => null);
  ttsChain = p;
  return p;
}

async function playBuf(buf){
  if(actx.state === "suspended") await actx.resume();
  return new Promise(res => {
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = 1.1;
    src.connect(actx.destination);
    src.onended = res;
    curSrc = src;
    setStatus("🔊 Говорю…");
    src.start();
  });
}

function bPlay(text, voice){
  return new Promise(res => {
    if(!window.speechSynthesis){ res(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ru-RU";
    if(voice) u.voice = voice;
    u.pitch = 1.0; u.rate = 1.15;
    u.onend = res; u.onerror = res;
    setStatus("🔊 Говорю…");
    speechSynthesis.speak(u);
    setTimeout(res, text.length * 100 + 4000);
  });
}

async function playItem(it, S){
  const e = voices.length ? voices[vi % voices.length] : null;
  if(it.p){
    let buf = null;
    try{ buf = await it.p; }catch(x){}
    if(S.dead) return;
    if(buf){ await playBuf(buf); return; }
    await bPlay(it.text, null);
    return;
  }
  await bPlay(it.text, e ? e.v : null);
}

function spStop(){
  const S = sp; sp = null;
  try{ if(curSrc) curSrc.stop(); }catch(e){}
  curSrc = null;
  if(window.speechSynthesis) speechSynthesis.cancel();
  speaking = false;
  if(S){ S.dead = true; if(S.cb) S.cb(); }
}
function stopAudio(){ spStop(); }

function spStart(){
  spStop();
  if(!$("v").checked) return;
  sp = {pos: 0, q: [], run: false, fin: false, dead: false, cb: null};
  speaking = true;
}

function spPush(S, text, e){
  const t = text.replace(/[*#_`]/g, "").trim();
  if(!t) return;
  const it = {text: t};
  if(e && e.g) it.p = gQueue(S, t, e.g);
  S.q.push(it);
}

function spFeed(full, final){
  const S = sp;
  if(!S || S.dead) return;
  const e = voices.length ? voices[vi % voices.length] : null;
  let rest = full.slice(S.pos);
  const re = /^[\s\S]{12,}?[.!?…]+["»)]*\s+/;
  let m;
  while((m = re.exec(rest))){
    spPush(S, rest.slice(0, m[0].length), e);
    S.pos += m[0].length;
    rest = rest.slice(m[0].length);
  }
  if(final){
    if(rest.trim()) spPush(S, rest, e);
    S.pos = full.length;
    S.fin = true;
  }
  spRun();
}

function spEnd(cb){
  const S = sp;
  if(!S){ speaking = false; if(cb) cb(); return; }
  S.cb = cb; S.fin = true;
  spRun();
}

async function spRun(){
  const S = sp;
  if(!S || S.run) return;
  S.run = true;
  while(!S.dead){
    const it = S.q.shift();
    if(!it){
      if(S.fin) break;
      await new Promise(r => setTimeout(r, 80));
      continue;
    }
    await playItem(it, S);
  }
  S.run = false;
  if(!S.dead){
    sp = null; speaking = false;
    if(S.cb) S.cb();
  }
}

function speak(text, cb){ spStart(); spFeed(text, true); spEnd(cb); }
function finish(){ busy = false; idle(); if(hf) setTimeout(listen, 300); }
const say = t => speak(t, finish);const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen(){ if(!rec || listening || speaking || busy) return; try{ rec.start(); }catch(e){} }
if(SR){
  rec = new SR();
  rec.lang = "ru-RU";
  rec.onstart = () => { listening = true; $("mic").classList.add("on"); setStatus("🎤 Слушаю…"); };
  rec.onend = () => {
    listening = false; $("mic").classList.remove("on");
    if(!busy && !speaking){ idle(); if(hf) setTimeout(listen, 500); }
  };
  rec.onresult = e => send(e.results[0][0].transcript);
  rec.onerror = e => {
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){
      hf = false; $("hf").classList.remove("on");
      add("j", "Нет доступа к микрофону. Разреши его для Chrome в настройках.");
    }else if(!hf && e.error !== "aborted" && e.error !== "no-speech"){
      add("j", "Микрофон: " + e.error);
    }
  };
  $("mic").onclick = () => {
    if(listening){ rec.stop(); return; }
    stopAudio(); listen();
  };
  $("hf").onclick = () => {
    hf = !hf;
    $("hf").classList.toggle("on", hf);
    if(hf){ listen(); } else { try{ rec.stop(); }catch(e){} }
    idle();
  };
}else{
  $("mic").style.display = "none";
  $("hf").style.display = "none";
}

// ---------- память и быстрые команды ----------
function local(t){
  const s = t.toLowerCase().replace(/[!?.,]/g, " ").replace(/\s+/g, " ").trim();
  const now = new Date();
  const m = t.trim().match(/^(запомни|запиши)[:,]?\s+(.+)/i);
  if(m){
    facts.push(m[2].trim()); facts = facts.slice(-30); sv("jfacts", facts);
    return "Запомнил: " + m[2].trim();
  }
  if(/что (ты )?(помнишь|знаешь) (обо мне|про меня)/.test(s))
    return facts.length ? "Я помню: " + facts.join("; ") : "Пока ничего. Скажи «запомни» и что нужно запомнить.";
  if(/^забудь (всё|все)/.test(s)){
    facts = []; hist = []; sv("jfacts", facts); sv("jhist", hist);
    $("chat").innerHTML = ""; return "Всё забыл.";
  }
  if(/^(привет|здравствуй|хай)/.test(s) && s.length < 20) return "Приветствую, Майки. Чем могу помочь?";
  if(/(который час|сколько времени)/.test(s))
    return "Сейчас " + now.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
  if(/(какое число|какая дата|какой сегодня день)/.test(s))
    return "Сегодня " + now.toLocaleDateString("ru-RU", {weekday:"long", day:"numeric", month:"long"});
  return null;
}

$("clr").onclick = () => { hist = []; sv("jhist", hist); $("chat").innerHTML = ""; add("j", "Чат очищен. Факты о тебе я сохранил."); };// ---------- нейросеть ----------
async function call(url, opt, ms){
  const c = new AbortController();
  const timer = setTimeout(() => c.abort(), ms);
  try{
    const r = await fetch(url, {...opt, signal: c.signal});
    const d = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error((d.error && d.error.message) || ("HTTP " + r.status));
    return d;
  }catch(e){
    if(e.name === "AbortError") throw new Error("нет ответа за " + (ms / 1000) + "с");
    throw e;
  }finally{ clearTimeout(timer); }
}

async function getModels(){
  if(models) return models;
  const d = await call(API + "models?pageSize=100&key=" + key, {}, 8000);
  const all = (d.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map(m => m.name)
    .filter(n => /flash/.test(n) && !/image|tts|live|audio|embed|thinking|exp|preview|latest|2\.5/.test(n));
  const lite = all.filter(n => /lite/.test(n));
  const rest = all.filter(n => !/lite/.test(n));
  models = [...lite, ...rest].slice(0, 5);
  if(!models.length) throw new Error("нет доступных flash-моделей");
  return models;
}

function makeBody(variant){
  const c = hist.slice(-10);
  while(c.length && c[0].role !== "user") c.shift();
  const body = {
    systemInstruction: {parts:[{text: sys()}]},
    contents: c,
    generationConfig: {maxOutputTokens: 400}
  };
  if(variant) body.generationConfig.thinkingConfig = variant;
  return body;
}

async function ask(m, variant){
  const d = await call(API + m + ":generateContent?key=" + key, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(makeBody(variant))
  }, 12000);
  const parts = (d.candidates && d.candidates[0] && d.candidates[0].content
                 && d.candidates[0].content.parts) || [];
  return parts.filter(p => !p.thought).map(p => p.text || "").join("");
}

async function askStream(m, variant, onText){
  const ctrl = new AbortController();
  let timer = setTimeout(() => ctrl.abort(), 12000);
  try{
    const r = await fetch(API + m + ":streamGenerateContent?alt=sse&key=" + key, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(makeBody(variant)),
      signal: ctrl.signal
    });
    if(!r.ok){
      const d = await r.json().catch(() => ({}));
      throw new Error((d.error && d.error.message) || ("HTTP " + r.status));
    }
    const rd = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", full = "";
    while(true){
      const {done, value} = await rd.read();
      if(done) break;
      clearTimeout(timer);
      timer = setTimeout(() => ctrl.abort(), 12000);
      buf += dec.decode(value, {stream: true});
      const lines = buf.split("\n");
      buf = lines.pop();
      for(const ln of lines){
        if(!ln.startsWith("data:")) continue;
        try{
          const d = JSON.parse(ln.slice(5));
          const ps = (d.candidates && d.candidates[0] && d.candidates[0].content
                      && d.candidates[0].content.parts) || [];
          for(const p of ps){
            if(p.text && !p.thought){ full += p.text; onText(full); }
          }
        }catch(e){}
      }
    }
    return full;
  }catch(e){
    if(e.name === "AbortError") throw new Error("нет ответа за 12с");
    throw e;
  }finally{ clearTimeout(timer); }
}let useStream = true;

async function send(text){
  text = text.trim();
  if(!text || busy) return;
  busy = true;
  add("u", text);
  $("t").value = "";

  const quick = local(text);
  if(quick){ add("j", quick); say(quick); return; }

  if(!key) askKey();
  if(!key){ add("j", "Нужен ключ: нажми 🔑"); finish(); return; }

  hist.push({role:"user", parts:[{text}]});
  const box = add("j", "");
  box.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  setStatus("💭 Думаю…");
  const log = [];
  try{
    let list = await getModels();
    if(good && list.includes(good.m)) list = [good.m, ...list.filter(x => x !== good.m)];
    for(const m of list){
      const name = m.replace("models/", "");
      const start = (good && good.m === m) ? good.v : 0;
      for(let vi2 = start; vi2 < VARS.length; vi2++){
        const t0 = Date.now();
        try{
          spStart();
          let first = true;
          const ans = useStream
            ? await askStream(m, VARS[vi2], t => {
                if(first){ first = false; setStatus("✍️ Отвечаю…"); }
                box.textContent = t;
                spFeed(t, false);
                $("chat").scrollTop = $("chat").scrollHeight;
              })
            : await ask(m, VARS[vi2]);
          if(!ans) throw new Error("пустой ответ");
          good = {m, v: vi2}; sv("jgood", good);
          hist.push({role:"model", parts:[{text:ans}]});
          hist = hist.slice(-30); sv("jhist", hist);
          box.textContent = ans;
          const s = document.createElement("small");
          s.textContent = name + " · " + ((Date.now() - t0) / 1000).toFixed(1) + "с";
          box.appendChild(s);
          $("chat").scrollTop = $("chat").scrollHeight;
          spFeed(ans, true);
          spEnd(finish);
          return;
        }catch(e){
          log.push(name + " [" + vi2 + "]: " + e.message.slice(0, 80));
          if(/API key not valid|API_KEY_INVALID/i.test(e.message)) throw e;
          if(/invalid argument|thinking/i.test(e.message)) continue;
          if(useStream && /Failed to fetch|getReader|reader|stream/i.test(e.message)){
            useStream = false; vi2--; continue;
          }
          break;
        }
      }
    }
    throw new Error("ни одна модель не ответила");
  }catch(e){
    spStop();
    hist.pop();
    box.textContent = "Ошибка: " + e.message + "\n\n" + log.join("\n");
    finish();
  }
}

$("go").onclick = () => send($("t").value);
$("t").addEventListener("keydown", e => { if(e.key === "Enter") send($("t").value); });

$("vc").onclick = () => {
  loadVoices();
  if(!voices.length){ add("j", "Голоса не найдены."); return; }
  vi = (vi + 1) % voices.length; sv("jvoice", vi);
  add("j", "Голос: " + voices[vi].name);
  speak("Здравствуйте, Майки. Я Джарвис.", null);
};

// ---------- старт ----------
hist.forEach(h => add(h.role === "user" ? "u" : "j", h.parts[0].text));
add("j", hist.length ? "С возвращением, Майки. Я Джарвис v15." : "Приветствую, Майки. Я Джарвис v15. Нажми 🎤 или включи 🎧 и просто говори.");
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script></body></html>
