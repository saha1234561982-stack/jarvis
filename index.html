<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Джарвис</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#e8ecff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:12px 16px;background:#121a33;display:flex;justify-content:space-between;align-items:center}
header b{color:#4fd1ff;font-size:20px}
header span{font-size:13px}
#chat{flex:1;overflow-y:auto;padding:12px}
.m{max-width:85%;padding:10px 14px;margin:8px 0;border-radius:16px;white-space:pre-wrap;line-height:1.4}
.u{background:#2a3a7a;margin-left:auto}
.j{background:#1a2347}
#bar{display:flex;gap:8px;padding:10px;background:#121a33}
#t{flex:1;padding:12px;border-radius:20px;border:0;background:#0b1020;color:#fff;font-size:16px}
button{border:0;border-radius:50%;width:46px;height:46px;font-size:20px;background:#4fd1ff}
button.on{background:#ff5470}
.k{background:none;width:auto;height:auto;font-size:18px;border-radius:0}
</style></head><body>
<header><b>🤖 Джарвис</b>
<span><label><input type="checkbox" id="v" checked> голос</label>
<button class="k" id="kb">🔑</button></span></header>
<div id="chat"></div>
<div id="bar">
<input id="t" placeholder="Скажи или напиши...">
<button id="mic">🎤</button>
<button id="go">➤</button>
</div>
<script>
const $ = id => document.getElementById(id);
const MODEL = "gemini-3.8-flash";
let key = localStorage.getItem("jkey") || "";
let hist = [];

function add(cls, text){
  const d = document.createElement("div");
  d.className = "m " + cls; d.textContent = text;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}

function askKey(){
  const k = prompt("Вставь ключ Gemini API:");
  if(k){ key = k.trim(); localStorage.setItem("jkey", key); }
}
$("kb").onclick = askKey;

function speak(text){
  if(!$("v").checked || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*#_`]/g, ""));
  u.lang = "ru-RU";
  speechSynthesis.speak(u);
}

let modelList = null;
async function models(){
  if(modelList) return modelList;
  const first = "models/" + MODEL;
  modelList = [first];
  try{
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=100&key=" + key);
    const d = await r.json();
    (d.models || []).forEach(m => {
      if((m.supportedGenerationMethods || []).includes("generateContent")
         && /flash/.test(m.name) && !/image|tts|live|audio|embed|thinking|exp/.test(m.name)
         && m.name !== first) modelList.push(m.name);
    });
  }catch(e){}
  return modelList;
}

async function send(text){
  text = text.trim();
  if(!text) return;
  if(!key) askKey();
  if(!key) return;
  add("u", text);
  $("t").value = "";
  hist.push({role:"user", parts:[{text}]});
  const wait = add("j", "…");
  try{
    let data;
    const list = (await models()).slice(0, 5);
    for(const m of list){
      let status = 0;
      for(let i = 0; i < 2; i++){
        wait.textContent = "Думаю… (" + m.replace("models/", "") + ")";
        const r = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/" + m + ":generateContent?key=" + key,
          {method:"POST", headers:{"Content-Type":"application/json"},
           body: JSON.stringify({
             systemInstruction:{parts:[{text:"Ты Джарвис, умный и дружелюбный голосовой ассистент. Отвечай по-русски, коротко и по делу."}]},
             contents: hist.slice(-20)
           })});
        status = r.status;
        data = await r.json();
        if(data.error && status === 503){
          await new Promise(res => setTimeout(res, 2000));
          continue;
        }
        break;
      }
      if(!data.error) break;
      const bad = /API key not valid|API_KEY_INVALID|PERMISSION_DENIED/i.test(JSON.stringify(data.error));
      if(bad) break;
    }
    if(data.error) throw new Error(data.error.message);
    const ans = data.candidates[0].content.parts.map(p => p.text).join("");
    hist.push({role:"model", parts:[{text:ans}]});
    wait.textContent = ans;
    speak(ans);
  }catch(e){
    hist.pop();
    wait.textContent = "Ошибка: " + e.message;
  }
}

$("go").onclick = () => send($("t").value);
$("t").addEventListener("keydown", e => { if(e.key === "Enter") send($("t").value); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){
  $("mic").style.display = "none";
}else{
  const rec = new SR();
  rec.lang = "ru-RU";
  rec.onstart = () => $("mic").classList.add("on");
  rec.onend = () => $("mic").classList.remove("on");
  rec.onresult = e => send(e.results[0][0].transcript);
  rec.onerror = e => add("j", "Микрофон: " + e.error);
  $("mic").onclick = () => { speechSynthesis.cancel(); rec.start(); };
}

add("j", "Привет, Майка! Я Джарвис. Нажми 🎤 и говори.");
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script></body></html>
